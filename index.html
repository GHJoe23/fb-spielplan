<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Chemie Dohna — Spielplan</title>
<style>
  :root { --gruen: #1b5e20; --gruen-hell: #e8f5e9; --grau: #666; --rot: #b71c1c; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; color: #222; background: #fafafa; }
  header { background: var(--gruen); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  header img { height: 52px; width: 52px; object-fit: contain; background: #fff; border-radius: 50%; padding: 3px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header .stand { font-size: .85rem; opacity: .9; margin-top: 4px; }
  .legende { padding: 8px 20px; font-size: .8rem; color: var(--grau); background: #fff; border-bottom: 1px solid #ddd; }
  .badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
  .badge-heim { background: var(--gruen); color: #fff; }
  .badge-aus { background: var(--rot); color: #fff; }
  .badge-tu { background: #555; color: #fff; }
  .filterbar { background: #fff; border-bottom: 1px solid #ddd; padding: 10px 20px; font-size: .85rem; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 4px 0; }
  .filter-label { font-weight: 700; color: var(--grau); }
  .chip { border: 1px solid #bbb; background: #f5f5f5; border-radius: 14px; padding: 2px 10px; font-size: .8rem; cursor: pointer; }
  .chip.active { background: var(--gruen); border-color: var(--gruen); color: #fff; }
  .view-switch { margin-left: auto; }
  .view-switch button { border: 1px solid var(--gruen); background: #fff; color: var(--gruen); padding: 3px 12px; font-size: .8rem; cursor: pointer; }
  .view-switch button:first-child { border-radius: 6px 0 0 6px; }
  .view-switch button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .view-switch button:not(:first-child):not(:last-child) { border-left: none; }
  .view-switch button.active { background: var(--gruen); color: #fff; }
  .print-btn { border: 1px solid #bbb; background: #f5f5f5; border-radius: 6px; padding: 3px 12px; font-size: .8rem; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  section.weekend { background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  section.weekend.current { border-color: var(--gruen); border-width: 2px; }
  details summary { cursor: pointer; padding: 12px 16px; font-weight: 700; background: #f0f0f0; list-style: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  section.weekend.current details summary { background: var(--gruen-hell); color: var(--gruen); }
  section.past { opacity: .55; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 7px 10px; border-top: 1px solid #eee; }
  th { background: #fafafa; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color: var(--grau); border-top: none; }
  tr.heimspiel td { background: var(--gruen-hell); }
  tr.heimspiel .paarung { font-weight: 700; }
  tr.abgesagt td { color: var(--grau); }
  tr.abgesagt .paarung { text-decoration: line-through; }
  tr.vergangen td { color: #999; }
  td.ergebnis { font-weight: 700; white-space: nowrap; }
  .kompakt-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .fehler { padding: 40px 20px; text-align: center; color: var(--rot); }
  /* --- Karten-Ansicht --- */
  .karten { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .karten { grid-template-columns: 1fr; } }
  .karte { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .karte.current { border-color: var(--gruen); border-width: 2px; }
  .karte.past { opacity: .55; }
  .karte-head { padding: 8px 12px; font-weight: 700; background: #f0f0f0; font-size: .9rem; }
  .karte.current .karte-head { background: var(--gruen-hell); color: var(--gruen); }
  .karte-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .karte-cols .kol { padding: 8px 10px; font-size: .8rem; }
  .karte-cols .kol:first-child { border-right: 1px solid #eee; }
  .kol h5 { margin: 6px 0 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; color: var(--grau); }
  .kol h5:first-child { margin-top: 0; }
  .zeile { padding: 2px 4px; border-radius: 4px; line-height: 1.45; }
  .zeile.h { background: var(--gruen-hell); font-weight: 600; }
  .zeile.abg { text-decoration: line-through; color: var(--grau); }
  .zeile .code { display: inline-block; min-width: 2.1em; font-weight: 700; color: var(--gruen); }
  .zeile .comp { color: var(--grau); font-size: .72rem; font-weight: 700; }
  .zeile .ort { color: var(--gruen); font-weight: 700; }
  .zeile .ort.aus { color: var(--rot); }
  .zeile .erg { font-weight: 700; }
  @media (max-width: 640px) {
    th:nth-child(6), td:nth-child(6), th:nth-child(7), td:nth-child(7) { display: none; }
  }
  @media print {
    body { background: #fff; font-size: 10pt; }
    header { background: #fff; color: #000; border-bottom: 2px solid #000; }
    header img { background: none; padding: 0; }
    .no-print { display: none !important; }
    section.weekend, section.past, .kompakt-box { opacity: 1; border: 1px solid #000; border-radius: 0; page-break-inside: avoid; margin-bottom: 10px; }
    .karten { gap: 8px; }
    .karte, .karte.past { opacity: 1; border: 1px solid #000; border-radius: 0; page-break-inside: avoid; }
    .karte.current { border-width: 1px; }
    details summary::before { content: ""; }
    tr.heimspiel td { background: #fff; border-left: 4px solid #000; }
    .zeile.h { background: #fff; border-left: 3px solid #000; }
    .badge-heim { border: 1px solid #000; background: #fff; color: #000; }
    .badge-aus { border: 1px solid var(--rot); background: #fff; color: var(--rot); }
    .badge-tu { border: 1px solid #555; background: #fff; color: #555; }
  }
</style>
</head>
<body>
<header>
  <img src="logo-chemie-dohna.png" alt="Vereinslogo SV Chemie Dohna">
  <div>
    <h1>SV Chemie Dohna — Spielplan</h1>
    <div class="stand" id="stand">lädt…</div>
  </div>
</header>
<div class="filterbar no-print" id="filterbar">
  <div class="filter-row">
    <span class="filter-label">Mannschaft:</span>
    <span id="klassen-chips"></span>
  </div>
  <div class="filter-row">
    <label><input type="checkbox" id="f-heim"> Nur Heimspiele</label>
    <label><input type="checkbox" id="f-expand"> Beim Druck alles aufklappen</label>
    <button class="print-btn" id="btn-print" type="button">🖨️ Drucken / PDF</button>
    <span class="view-switch">
      <button id="v-wochen" class="active" type="button">Wochenenden</button><button id="v-karten" type="button">Karten</button><button id="v-liste" type="button">Liste</button>
    </span>
  </div>
</div>
<div class="legende no-print" id="legende">
  Heimspiele grün <span class="badge badge-heim">HEIM</span> · <span class="badge badge-aus">abgesagt</span> · <span class="badge badge-tu">TU</span> Turnier/Kinderfestival
  · Karten-Kürzel: H1/H2 Herren, A, C, D, E5/E6, F1/F2, G · Orte: R = Rasen Dohna, KR = Kunstrasen Dohna, GK = Gorknitz, @ = Auswärts · Wettbewerbe: POK, FS, KF
</div>
<main id="inhalt"></main>
<script>
// ==LOGIK-START==
const VEREIN = "SV Chemie Dohna";

function weekendKey(iso) {
  // Liefert den Freitag (YYYY-MM-DD) des Wochenendes, zu dem das Datum gehört.
  // Fr/SA/So -> eigenes Wochenende; Mo-Do -> vorheriges Wochenende.
  const d = new Date(iso + "T12:00:00");
  const dow = d.getDay(); // 0=So, 5=Fr, 6=Sa
  const off = dow === 5 ? 0 : dow === 6 ? -1 : dow === 0 ? -2 : -(dow + 2);
  const fr = new Date(d);
  fr.setDate(d.getDate() + off);
  return fr.toISOString().slice(0, 10);
}

function sundayOf(key) {
  const d = new Date(key + "T12:00:00");
  d.setDate(d.getDate() + 2);
  return d.toISOString().slice(0, 10);
}

function fmtDate(iso) {
  const [y, m, t] = iso.split("-");
  return `${t}.${m}.${y}`;
}

function isHeim(spiel) {
  // "Chemie Dohna" irgendwo im Heim-Namen: deckt "SV Chemie Dohna 2.",
  // "- Kinderfestival" und SpG-Namen wie "SpG LSV Gorknitz 61 / SV Chemie Dohna 9er NWM" ab.
  return (spiel.heim || "").includes("Chemie Dohna");
}

function fuellGrad(s) {
  // Wie informationsreich ist eine Zeile? (für Dedupe: die reichere gewinnt)
  let n = 0;
  if (s.spielort) n++;
  if (s.wettbewerb) n++;
  if (s.spielart) n++;
  if (s.ergebnis && s.ergebnis !== "-:-") n++;
  if (s.hinweis) n++;
  return n;
}

function dedupe(spiele) {
  // Gleiche Begegnung kann aus Widget UND Druckansicht mit verschiedenen
  // Kennungen kommen (Kinderfestivals!). Schlüssel = Datum+Zeit+Klasse+Teams.
  const map = new Map();
  for (const s of spiele) {
    const key = [s.datumISO, s.uhrzeit, s.altersklasse, s.heim, s.gast].join("|");
    const alt = map.get(key);
    if (!alt || fuellGrad(s) > fuellGrad(alt)) map.set(key, s);
  }
  return [...map.values()];
}

function filterSpiele(spiele, klassen, nurHeim) {
  // klassen: Set der sichtbaren Altersklassen (leer = alle)
  return spiele.filter(s =>
    (klassen.size === 0 || klassen.has(s.altersklasse)) &&
    (!nurHeim || isHeim(s))
  );
}

function teamCode(s) {
  // Kürzel unserer Mannschaft. Bei Kinderfestivals steht unser Team im Gast-Feld.
  const wir = (s.heim || "").includes("- Kinderfestival") ? (s.gast || "") : ((s.heim || "").includes("Chemie Dohna") ? s.heim : s.gast);
  const rest = (wir || "").replace(/SV Chemie Dohna\s*/i, "");
  if (s.altersklasse === "Herren") return /2\./.test(rest) ? "H2" : "H1";
  if (s.altersklasse === "A-Junioren") return "A";
  if (s.altersklasse === "C-Junioren") return "C";
  if (s.altersklasse === "D-Junioren") return "D";
  if (s.altersklasse === "E-Junioren") return /6x6/.test(rest) ? "E6" : "E5";
  if (s.altersklasse === "F-Junioren") return /2\./.test(rest) ? "F2" : "F1";
  if (s.altersklasse === "G-Junioren") return "G";
  return s.altersklasse || "?";
}

function venueCode(s) {
  // Ortskürzel bei Heimspielen: R = Rasen Dohna, KR = Kunstrasen Dohna, GK = Gorknitz
  if (!isHeim(s)) return "@";
  const o = (s.spielort || "").toLowerCase();
  if (o.includes("gorknitz")) return "GK";
  if (o.includes("kunstrasen")) return "KR";
  return "R";
}

function compCode(s) {
  return { PO: "POK", FS: "FS", TU: "KF" }[s.spielart] || "";
}

function ergAusUnsererSicht(s) {
  // Ergebnis liegt aus Heim-Sicht vor; aus Chemie-Sicht drehen, wenn Auswärts.
  const m = (s.ergebnis || "").match(/(\d+)\s*:\s*(\d+)/);
  if (!m) return "";
  return isHeim(s) ? `${m[1]}:${m[2]}` : `${m[2]}:${m[1]}`;
}

function gegner(s) {
  return isHeim(s) ? (s.gast || "") : (s.heim || "");
}

function gruppiere(spiele, heuteISO) {
  const gruppen = new Map();
  for (const s of spiele) {
    if (!s.datumISO) continue;
    const key = weekendKey(s.datumISO);
    if (!gruppen.has(key)) gruppen.set(key, []);
    gruppen.get(key).push(s);
  }
  return [...gruppen.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([key, list]) => ({
      key,
      sonntag: sundayOf(key),
      vergangen: sundayOf(key) < heuteISO,
      spiele: list.sort((a, b) => (a.datumISO + a.uhrzeit).localeCompare(b.datumISO + b.uhrzeit))
    }));
}
// ==LOGIK-END==

// ---- Zustand (persistiert im Browser) ----
const state = Object.assign(
  { klassen: [], nurHeim: false, expand: false, view: "wochen" },
  JSON.parse(localStorage.getItem("fbde-spielplan") || "{}")
);
let ALLE = [];      // deduplizierte Rohdaten
let HEUTE = "";

function saveState() {
  localStorage.setItem("fbde-spielplan", JSON.stringify(state));
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function badgesFuer(s) {
  const badges = [];
  if (isHeim(s)) badges.push('<span class="badge badge-heim">HEIM</span>');
  if (s.status === "cancelled") badges.push(`<span class="badge badge-aus">${esc(s.hinweis || "abgesagt")}</span>`);
  if (s.spielart === "TU") badges.push('<span class="badge badge-tu">TU</span>');
  return badges.join("");
}

function zeile(s, mitVergangenheit) {
  const abgesagt = s.status === "cancelled";
  const klassen = ["spiel"];
  if (isHeim(s)) klassen.push("heimspiel");
  if (abgesagt) klassen.push("abgesagt");
  if (mitVergangenheit && s.datumISO < HEUTE) klassen.push("vergangen");
  const erg = !s.ergebnis || s.ergebnis === "-:-" ? "–" : esc(s.ergebnis);
  return `<tr class="${klassen.join(" ")}">
    <td>${esc(s.wochentag)} ${fmtDate(s.datumISO).slice(0, 6)}</td>
    <td>${esc(s.uhrzeit)}</td>
    <td>${esc(s.altersklasse)}</td>
    <td class="paarung">${esc(s.heim)} vs. ${esc(s.gast)}${badgesFuer(s)}</td>
    <td class="ergebnis">${erg}</td>
    <td>${esc(s.spielort)}</td>
    <td>${esc(s.wettbewerb)}</td>
  </tr>`;
}

function kartenZeile(s) {
  const abg = s.status === "cancelled";
  const heim = isHeim(s);
  const erg = ergAusUnsererSicht(s);
  const teile = [
    esc(s.uhrzeit || "–"),
    `<span class="code">${esc(teamCode(s))}</span>`,
    compCode(s) ? `<span class="comp">${esc(compCode(s))}</span>` : "",
    heim ? `<span class="ort">${esc(venueCode(s))}</span>` : `<span class="ort aus">@</span>`,
    `<span class="geg">${esc(gegner(s))}</span>`,
    erg ? `<span class="erg">${erg}</span>` : ""
  ].filter(Boolean);
  return `<div class="zeile${heim ? " h" : ""}${abg ? " abg" : ""}">${teile.join(" ")}</div>`;
}

function renderKarten(spiele) {
  const gruppen = gruppiere(spiele, HEUTE);
  const naechste = gruppen.find(g => !g.vergangen);
  if (gruppen.length === 0) return '<div class="fehler">Keine Spiele im aktuellen Filter.</div>';
  const karten = gruppen.map(g => {
    const cls = "karte" + (g.vergangen ? " past" : "") + (naechste && g.key === naechste.key ? " current" : "");
    // Linke Spalte: Fr + Sa (+ unter der Woche hineingerutschte), rechte Spalte: So
    const sonntag = g.spiele.filter(s => s.datumISO === g.sonntag);
    const rest = g.spiele.filter(s => s.datumISO !== g.sonntag);
    const nachTagen = (list) => {
      const tage = [...new Set(list.map(s => s.datumISO))].sort();
      return tage.map(t => {
        const tagSpiele = list.filter(s => s.datumISO === t);
        const wt = tagSpiele[0].wochentag || "";
        return `<h5>${esc(wt)} ${fmtDate(t).slice(0, 6)}</h5>` + tagSpiele.map(kartenZeile).join("");
      }).join("");
    };
    return `<div class="${cls}">
      <div class="karte-head">Fr ${fmtDate(g.key).slice(0, 6)} – So ${fmtDate(g.sonntag).slice(0, 6)} · ${g.spiele.length} ${g.spiele.length === 1 ? "Spiel" : "Spiele"}</div>
      <div class="karte-cols">
        <div class="kol">${nachTagen(rest) || '<div class="zeile" style="color:#999">–</div>'}</div>
        <div class="kol">${nachTagen(sonntag) || '<div class="zeile" style="color:#999">–</div>'}</div>
      </div>
    </div>`;
  }).join("");
  return `<div class="karten">${karten}</div>`;
}

function renderWochenenden(spiele) {
  const gruppen = gruppiere(spiele, HEUTE);
  const naechste = gruppen.find(g => !g.vergangen);
  if (gruppen.length === 0) return '<div class="fehler">Keine Spiele im aktuellen Filter.</div>';
  return gruppen.map(g => {
    const offen = naechste && g.key === naechste.key ? " open" : "";
    const cls = "weekend" + (g.vergangen ? " past" : "") + (offen ? " current" : "");
    const anzahl = g.spiele.length === 1 ? "1 Spiel" : g.spiele.length + " Spiele";
    return `<section class="${cls}">
      <details${offen}>
        <summary>Fr ${fmtDate(g.key)} – So ${fmtDate(g.sonntag)} (${anzahl})</summary>
        <table>
          <thead><tr><th>Tag</th><th>Zeit</th><th>Klasse</th><th>Begegnung</th><th>Erg.</th><th>Spielort</th><th>Wettbewerb</th></tr></thead>
          <tbody>${g.spiele.map(s => zeile(s, false)).join("")}</tbody>
        </table>
      </details>
    </section>`;
  }).join("");
}

function renderKompakt(spiele) {
  if (spiele.length === 0) return '<div class="fehler">Keine Spiele im aktuellen Filter.</div>';
  const sortiert = [...spiele].sort((a, b) => (a.datumISO + a.uhrzeit).localeCompare(b.datumISO + b.uhrzeit));
  return `<div class="kompakt-box"><table>
    <thead><tr><th>Datum</th><th>Zeit</th><th>Klasse</th><th>Begegnung</th><th>Erg.</th><th>Spielort</th><th>Wettbewerb</th></tr></thead>
    <tbody>${sortiert.map(s => zeile(s, true)).join("")}</tbody>
  </table></div>`;
}

function render() {
  const gefiltert = filterSpiele(ALLE, new Set(state.klassen), state.nurHeim);
  const inhalt = document.getElementById("inhalt");
  inhalt.innerHTML =
    state.view === "karten" ? renderKarten(gefiltert) :
    state.view === "liste" ? renderKompakt(gefiltert) :
    renderWochenenden(gefiltert);
  for (const v of ["wochen", "karten", "liste"]) {
    document.getElementById("v-" + v).classList.toggle("active", state.view === v);
  }
}

function renderChips() {
  const klassen = [...new Set(ALLE.map(s => s.altersklasse).filter(Boolean))].sort();
  document.getElementById("klassen-chips").innerHTML = klassen.map(k =>
    `<button type="button" class="chip${state.klassen.length === 0 || state.klassen.includes(k) ? " active" : ""}" data-k="${esc(k)}">${esc(k)}</button>`
  ).join("");
  document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
    const k = chip.dataset.k;
    // Keine Auswahl (= alle aktiv) -> Klick startet Einzelauswahl
    if (state.klassen.length === 0) {
      state.klassen = klassen.filter(x => x !== k);
    } else if (state.klassen.includes(k)) {
      state.klassen = state.klassen.filter(x => x !== k);
    } else {
      state.klassen = [...state.klassen, k];
    }
    if (state.klassen.length === klassen.length || state.klassen.length === 0) state.klassen = [];
    saveState(); renderChips(); render();
  }));
}

document.getElementById("f-heim").checked = state.nurHeim;
document.getElementById("f-expand").checked = state.expand;
document.getElementById("f-heim").addEventListener("change", e => { state.nurHeim = e.target.checked; saveState(); render(); });
document.getElementById("f-expand").addEventListener("change", e => { state.expand = e.target.checked; saveState(); });
document.getElementById("v-wochen").addEventListener("click", () => { state.view = "wochen"; saveState(); render(); });
document.getElementById("v-karten").addEventListener("click", () => { state.view = "karten"; saveState(); render(); });
document.getElementById("v-liste").addEventListener("click", () => { state.view = "liste"; saveState(); render(); });
document.getElementById("btn-print").addEventListener("click", () => window.print());

// Beim Drucken nur aufklappen, wenn es der Nutzer aktiviert hat
window.addEventListener("beforeprint", () => {
  if (state.expand) document.querySelectorAll("details").forEach(d => d.open = true);
});

fetch("spieldaten.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    document.getElementById("stand").textContent = "Stand: " + (data.stand || "unbekannt");
    HEUTE = new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD lokal
    ALLE = dedupe(data.spiele || []);
    renderChips();
    render();
  })
  .catch(e => {
    document.getElementById("stand").textContent = "";
    document.getElementById("inhalt").innerHTML = '<div class="fehler">spieldaten.json konnte nicht geladen werden (' + esc(e.message) + ").</div>";
  });
</script>
</body>
</html>
