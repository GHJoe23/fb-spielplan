<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Chemie Dohna — Spieltagsflyer</title>
<style>
  /* Design-Tokens wie develop.chemie-dohna.de (Theme chemie-dohna-2026) */
  @font-face { font-family: 'Anton'; font-weight: 400; font-display: swap;
               src: url(assets/fonts/anton-400-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap;
               src: url(assets/fonts/barlow-condensed-600-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap;
               src: url(assets/fonts/barlow-condensed-700-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Hanken Grotesk'; font-weight: 400 800; font-display: swap;
               src: url(assets/fonts/hanken-grotesk-latin.woff2) format('woff2'); }

  :root { --neon: #99FE00; --neon-2: #B6FF45; --schwarz: #0A0D0A; --weiss: #FFFFFF;
          --gruen-600: #176B36; --gruen-700: #114A26; --gruen-800: #0E331B;
          --muted: #6c7a6c; --rule: #e6ebe1; --warn: #e8a000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #3a3f3a; display: flex; justify-content: center; font-family: "Hanken Grotesk", system-ui, sans-serif; }
  #stage { transform-origin: top center; }

  /* Flyer-Leinwand 1080x1350 (WhatsApp/Instagram-tauglich). Innen alles in em -> Auto-Skalierung ueber font-size. */
  #flyer { width: 1080px; height: 1350px; background: var(--weiss); color: var(--schwarz);
           display: flex; flex-direction: column; font-size: 30px; overflow: hidden; }

  header { display: flex; align-items: center; gap: 0.7em; padding: 0.75em 1.1em 0.45em 1.1em; }
  header img { height: 4.2em; width: 4.2em; object-fit: contain; }
  .verein { font-family: "Barlow Condensed"; font-weight: 700; font-size: 0.95em; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--gruen-600); }
  .titel { font-family: "Anton"; font-size: 2.6em; text-transform: uppercase; line-height: 0.95; }
  .zeitraum { font-family: "Barlow Condensed"; font-weight: 600; font-size: 1.05em; color: var(--muted); margin-top: 0.25em; }
  .kopf-regel { height: 0.28em; background: var(--neon); margin: 0 1.1em; }

  main { flex: 1; padding: 0.35em 1.1em 0 1.1em; }
  .tag { margin-top: 0.5em; }
  .tag-kopf { font-family: "Anton"; font-size: 1.25em; text-transform: uppercase; letter-spacing: 0.03em;
              padding-bottom: 0.18em; margin-bottom: 0.2em; border-bottom: 2px solid var(--schwarz); }
  .tag-kopf::before { content: ""; display: inline-block; width: 0.42em; height: 0.85em;
                      background: var(--neon); margin-right: 0.4em; }

  .spiel { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.55em;
           padding: 0.3em 0; border-bottom: 1px solid var(--rule); }
  .spiel:last-child { border-bottom: none; }
  .wappen { width: 2.3em; height: 2.3em; object-fit: contain; }
  .wappen-fehlt { position: relative; width: 2.3em; height: 2.3em; }
  .wappen-fehlt svg { width: 100%; height: 100%; }
  .wappen-fehlt::after { content: "!"; position: absolute; right: -0.15em; top: -0.15em; width: 0.85em; height: 0.85em;
                         background: var(--warn); color: var(--weiss); font-family: "Barlow Condensed"; font-weight: 700;
                         font-size: 0.55em; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .mitte { text-align: center; min-width: 0; }
  .paarung { font-weight: 700; font-size: 1.0em; line-height: 1.15; }
  .meta { font-family: "Barlow Condensed"; font-weight: 600; font-size: 0.82em; color: var(--muted); margin-top: 0.1em; }
  .meta .klasse { color: var(--schwarz); font-weight: 700; }
  .meta .wettbewerb { color: var(--gruen-700); font-weight: 700; }
  .seite { display: inline-block; font-family: "Barlow Condensed"; font-weight: 700; font-size: 0.68em;
           text-transform: uppercase; letter-spacing: 0.08em; padding: 0.22em 0.7em; border-radius: 1em; margin-top: 0.3em; }
  .seite.heim { background: var(--neon); color: var(--schwarz); }
  .seite.aus { border: 2px solid var(--gruen-600); color: var(--gruen-600); }
  .erg { font-family: "Anton"; font-size: 1.7em; color: var(--gruen-700); margin-top: 0.05em; line-height: 1; }
  .spiel.abgesagt { opacity: 0.55; }
  .spiel.abgesagt .paarung { text-decoration: line-through; }
  .hinweis { color: #b3401e; font-weight: 700; }

  .leer { margin-top: 2.5em; text-align: center; color: var(--muted); font-size: 1.1em; line-height: 1.5; }

  .warnung { margin: 0.3em 1.1em 0; padding: 0.35em 0.7em; background: #fdf3d7; border-left: 6px solid var(--warn);
             font-family: "Barlow Condensed"; font-weight: 600; font-size: 0.75em; color: #7a5a00; }

  footer { display: flex; justify-content: space-between; align-items: center; background: var(--schwarz);
           padding: 0.5em 1.15em; font-family: "Barlow Condensed"; font-weight: 600; font-size: 0.85em; color: var(--weiss); }
  footer .ruf { color: var(--neon); font-family: "Anton"; font-size: 1.15em; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="stage">
  <div id="flyer">
    <header>
      <img src="assets/chemie-logo-xxl.png" alt="Wappen SV Chemie Dohna">
      <div>
        <div class="verein">SV Chemie Dohna</div>
        <div class="titel" id="titel">Spieltag</div>
        <div class="zeitraum" id="zeitraum">l&auml;dt&hellip;</div>
      </div>
    </header>
    <div class="kopf-regel"></div>
    <main id="spiele"></main>
    <div class="warnung" id="warnung" style="display:none"></div>
    <footer>
      <span class="ruf">Eisern Chemie!</span>
      <span id="seitenanzeige"></span>
      <span>ghjoe23.github.io/fb-spielplan</span>
    </footer>
  </div>
</div>

<script>
// Spieltagsflyer: liest spieldaten.json + vereine.json, rendert das Wochenende (Fr–So).
// Parameter: ?modus=vorschau (Default, kommendes/laufendes Wochenende) | ergebnisse (letztes Wochenende)
//            ?datum=YYYY-MM-DD (Referenztag ueberschreiben, fuer Tests)
// Rohinhalt aus der Tabelle: volle Mannschaftsnamen, Altersklasse, Wettbewerb, Spielort — keine Umdichtungen.
const params = new URLSearchParams(location.search);
const MODUS = params.get('modus') === 'ergebnisse' ? 'ergebnisse' : 'vorschau';
const REF = params.get('datum') ? new Date(params.get('datum') + 'T12:00:00') : new Date();
const SEITE = Math.max(parseInt(params.get('seite') || '1', 10) || 1, 1);
const PRO_SEITE = 9; // max. Spiele pro Flyer-Seite (Tagesgruppen bleiben zusammen)

function freitagWoche(d) {
  const wt = d.getDay(); // 0=So .. 6=Sa
  // Freitag der Mo-So-Woche: Mo-Fr -> dieser Freitag (Offset 0..4),
  // Sa -> -1, So -> -2 (sonst kaeme der Freitag der FOLGENDEN Woche heraus).
  const offset = (5 - wt + 7) % 7;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (offset > 4 ? offset - 7 : offset));
}
function wochenende(ref, richtung) {
  // Liefert [Freitag 00:00, Sonntag 23:59:59] auf Freitag-der-Woche-Basis:
  // 'next': Mo-Do -> dieses Wochenende, Fr-So -> naechstes Wochenende (vorschau).
  // 'prev': Sa/So -> das aktuelle, gerade zu Ende gehende Wochenende; Mo-Fr -> das davor (ergebnisse).
  const d = new Date(ref); d.setHours(0, 0, 0, 0);
  const wt = d.getDay();
  const thisFr = freitagWoche(d);
  let fr;
  if (richtung === 'next') {
    // Mo-Do -> dieses Wochenende; Fr-So -> naechstes Wochenende
    fr = (wt >= 5 || wt === 0) ? new Date(thisFr.getTime() + 7 * 86400000) : thisFr;
  } else {
    // Sa/So -> das aktuelle/gerade zu Ende gehende Wochenende; Mo-Fr -> das davor
    fr = (wt === 0 || wt === 6) ? thisFr : new Date(thisFr.getTime() - 7 * 86400000);
  }
  const freitag = new Date(fr); freitag.setHours(0, 0, 0, 0);
  const sonntag = new Date(fr); sonntag.setDate(sonntag.getDate() + 2); sonntag.setHours(23, 59, 59, 999);
  return [freitag, sonntag];
}

const fmt = (d) => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const CHEMIE = 'chemie dohna';
const istChemie = (name) => (name || '').toLowerCase().includes(CHEMIE);

// Fussball-Platzhalter (inline SVG, beliebig skalierbar), wenn kein Wappen existiert.
const FUSSBALL_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#0A0D0A" stroke-width="5"/>
  <path d="M50 30 L68 43 L61 64 L39 64 L32 43 Z" fill="#0A0D0A"/>
  <g stroke="#0A0D0A" stroke-width="4" fill="none">
    <path d="M50 30 L50 8"/><path d="M68 43 L89 35"/><path d="M61 64 L75 82"/>
    <path d="M39 64 L25 82"/><path d="M32 43 L11 35"/>
  </g></svg>`;

async function start() {
  // Entwurfs-Modus: Daten wurden per add_init_script injiziert (POST /api/flyer) —
  // der Produzent hat das Wochenfenster bereits gewaehlt, daher KEIN Fenster-Filter.
  // Sonst (GET, spieldaten.json aus dem Repo): Fenster-Filter wie bisher.
  const spieldaten = window.__ENTWURF__ || await fetch('spieldaten.json').then(r => r.json());
  const vereine = await fetch('vereine.json').then(r => r.json());
  document.getElementById('titel').textContent = MODUS === 'vorschau' ? 'Spieltag' : 'Ergebnisse';

  // Modus-Regeln: ergebnisse -> nur Spiele mit Ergebnis; vorschau -> alle ausser 'entfernt'.
  const modusFilter = (s) => s.status === 'entfernt' ? false
    : (MODUS === 'ergebnisse' ? (s.ergebnis && s.ergebnis !== '-:-') : true);

  let imFenster;
  if (window.__ENTWURF__) {
    // Injektierte Daten: kein Fenster-Filter; Zeitraum-Header aus min/max der gerenderten Spiele.
    imFenster = (spieldaten.spiele || []).filter(modusFilter);
    const iso = imFenster.map(s => s.datumISO).sort();
    document.getElementById('zeitraum').textContent = iso.length > 0
      ? fmt(new Date(iso[0] + 'T12:00:00')) + ' – ' + fmt(new Date(iso[iso.length - 1] + 'T12:00:00'))
      : '';
  } else {
    const [von, bis] = wochenende(REF, MODUS === 'vorschau' ? 'next' : 'prev');
    document.getElementById('zeitraum').textContent = fmt(von) + ' – ' + fmt(bis);
    imFenster = (spieldaten.spiele || []).filter(s => {
      const t = new Date(s.datumISO + 'T12:00:00');
      if (t < von || t > bis) return false;
      return modusFilter(s);
    });
  }
  imFenster.sort((a, b) => (a.datumISO + a.uhrzeit).localeCompare(b.datumISO + b.uhrzeit));

  let fehlendeWappen = 0;
  const wappenHtml = (name) => {
    if (istChemie(name)) return `<img class="wappen" src="assets/chemie-logo.png" alt="">`;
    const src = vereine[name];
    if (src) return `<img class="wappen" src="${src}" alt="">`;
    fehlendeWappen++;
    return `<span class="wappen-fehlt">${FUSSBALL_SVG}</span>`;
  };

  const main = document.getElementById('spiele');
  if (imFenster.length === 0) {
    main.innerHTML = '<div class="leer">Spielfreies Wochenende —<br>keine Spiele gemeldet.</div>';
    document.body.dataset.seiten = 1;
  } else {
    const tage = {};
    for (const s of imFenster) (tage[s.datumISO] = tage[s.datumISO] || []).push(s);
    // Seiten bilden: ganze Tagesgruppen, bis PRO_SEITE Spiele voll sind.
    const seiten = [[]];
    let zaehl = 0;
    for (const eintrag of Object.entries(tage)) {
      if (zaehl > 0 && zaehl + eintrag[1].length > PRO_SEITE) { seiten.push([]); zaehl = 0; }
      seiten[seiten.length - 1].push(eintrag);
      zaehl += eintrag[1].length;
    }
    document.body.dataset.seiten = seiten.length;
    const idx = Math.min(SEITE - 1, seiten.length - 1);
    if (seiten.length > 1) document.getElementById('seitenanzeige').textContent = 'Seite ' + (idx + 1) + '/' + seiten.length;
    main.innerHTML = seiten[idx].map(([iso, spiele]) => {
      const kopf = spiele[0].wochentag + ', ' + fmt(new Date(iso + 'T12:00:00'));
      const zeilen = spiele.map(s => {
        const abg = s.status === 'cancelled';
        const seite = istChemie(s.heim);
        const mitte = MODUS === 'ergebnisse'
          ? `<div class="erg">${s.ergebnis}</div>`
          : `<div><span class="seite ${seite ? 'heim' : 'aus'}">${seite ? 'Heimspiel' : 'Ausw&auml;rts'}</span></div>`;
        const hinweis = (abg && s.hinweis) ? ` · <span class="hinweis">${s.hinweis}</span>` : '';
        return `<div class="spiel${abg ? ' abgesagt' : ''}">
          ${wappenHtml(s.heim)}
          <div class="mitte">
            <div class="paarung">${s.heim} – ${s.gast}</div>
            <div class="meta">${s.uhrzeit} Uhr · <span class="klasse">${s.altersklasse}</span> · <span class="wettbewerb">${s.wettbewerb}</span>${s.spielort ? ' · ' + s.spielort : ''}${hinweis}</div>
            ${mitte}
          </div>
          ${wappenHtml(s.gast)}
        </div>`;
      }).join('');
      return `<div class="tag"><div class="tag-kopf">${kopf}</div>${zeilen}</div>`;
    }).join('');
  }

  if (fehlendeWappen > 0) {
    const w = document.getElementById('warnung');
    w.style.display = 'block';
    w.textContent = `⚠ ${fehlendeWappen} Wappen nicht hinterlegt (Fussball-Platzhalter) — Nachreichen ueber das Logo-Formular.`;
  }

  // Auto-Fit und fertig-Signal erst NACH dem Font-Laden: mit Fallback-Fonts messen wir sonst
  // falsch, die Webfonts (Anton/Barlow/Hanken) wachsen das Layout nachtraeglich -> Footer wuerde abgeschnitten.
  document.fonts.ready.then(() => {
    const flyer = document.getElementById('flyer');
    let fs = 30;
    while (flyer.scrollHeight > 1350 && fs > 17) { fs -= 1; flyer.style.fontSize = fs + 'px'; }
    if (flyer.scrollHeight > 1350) console.warn('Flyer laeuft ueber: zu viele Spiele auch bei kleinster Schrift (Seitenaufteilung pruefen)');
    flyer.dataset.fertig = '1'; // Signal fuer den Headless-Renderer (/api/flyer)
  });

  // Vorschau-Skalierung aufs Browserfenster (beim Headless-Rendering 1080x1350 -> Faktor exakt 1).
  const scale = Math.min(1, window.innerWidth / 1080, window.innerHeight / 1350);
  const st = document.getElementById('stage');
  st.style.transform = 'scale(' + scale + ')';
  st.style.width = 1080 * scale + 'px';
  st.style.height = 1350 * scale + 'px';
}
start().catch(e => { document.getElementById('zeitraum').textContent = 'Fehler: ' + e.message; });
</script>
</body>
</html>
